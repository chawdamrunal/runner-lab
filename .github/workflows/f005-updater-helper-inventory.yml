name: f005-updater-helper-inventory

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  exact-updater-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the owned inventory harness
        uses: actions/checkout@v4

      - name: Pull and bind the exact updater image
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/dependabot/dependabot-updater-bundler:v2.0.20261007230529@sha256:0c3e2ed47adc7b21b82ac89c11a8768ae69c839c01f99b609f187fddd3431f89'
          evidence="$RUNNER_TEMP/f005-updater-helper-inventory"
          mkdir -p "$evidence"
          chmod 0777 "$evidence"
          docker pull "$image"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          docker image inspect "$image" \
            --format 'repo_digests={{json .RepoDigests}} image_id={{.Id}}' \
            | tee "$evidence/image-binding.txt"

      - name: Inventory privilege-transition files without executing them
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/dependabot/dependabot-updater-bundler:v2.0.20261007230529@sha256:0c3e2ed47adc7b21b82ac89c11a8768ae69c839c01f99b609f187fddd3431f89'
          evidence="$RUNNER_TEMP/f005-updater-helper-inventory"
          sandbox=(
            --rm
            --network none
            --cap-drop ALL
            --security-opt no-new-privileges
            --tmpfs /tmp:rw,nosuid,nodev,size=64m
            --pids-limit 64
            --memory 512m
            --memory-swap 512m
            --mount "type=bind,src=$evidence,dst=/evidence"
          )
          readonly_sandbox=("${sandbox[@]}" --read-only)

          docker run "${readonly_sandbox[@]}" --cap-add DAC_OVERRIDE \
            --user root --entrypoint /bin/bash \
            "$image" -c '
              set -euo pipefail
              : > /evidence/suid-sgid.txt
              while IFS= read -r path; do
                stat --printf="mode=%a uid=%u gid=%g size=%s path=%n\n" "$path"
                sha256sum "$path"
                dpkg-query -S "$path" 2>/dev/null || true
                printf "\n"
              done < <(find / -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null | sort) \
                > /evidence/suid-sgid.txt

              if command -v getcap >/dev/null 2>&1; then
                getcap -r / 2>/dev/null | sort > /evidence/file-capabilities.txt
              else
                printf "getcap_unavailable=true\n" > /evidence/file-capabilities.txt
              fi

              { find / -xdev -type f \( -perm -0002 -o -perm -0020 \) \
                  -printf "mode=%m uid=%u gid=%g path=%p\n" \
                  2>/evidence/group-world-writable-files.errors.txt || :; } \
                | sort > /evidence/group-world-writable-files.txt
              { find / -xdev -type d \( -perm -0002 -o -perm -0020 \) \
                  -printf "mode=%m uid=%u gid=%g path=%p\n" \
                  2>/evidence/group-world-writable-dirs.errors.txt || :; } \
                | sort > /evidence/group-world-writable-dirs.txt
              cat /etc/os-release > /evidence/os-release.txt
              dpkg-query -W -f="\${binary:Package}\\t\${Version}\\n" \
                | sort > /evidence/packages.txt
            '

          docker run "${readonly_sandbox[@]}" --user dependabot --entrypoint /bin/bash \
            "$image" -c '
              set -euo pipefail
              id
              printf "path=%s\n" "$PATH"
              IFS=: read -ra paths <<<"$PATH"
              for path in "${paths[@]}"; do
                if [ -e "$path" ]; then
                  stat --printf="mode=%a uid=%u gid=%g writable=%A path=%n\n" "$path"
                  if [ -w "$path" ]; then printf "dependabot_writable=true path=%s\n" "$path"; fi
                fi
              done
            ' > "$evidence/dependabot-path-readonly.txt"

          docker run "${readonly_sandbox[@]}" --cap-add DAC_OVERRIDE \
            --mount "type=bind,src=$GITHUB_WORKSPACE/research/f005-helper-inventory/scan_file_caps.py,dst=/scan_file_caps.py,readonly" \
            --user root --entrypoint /usr/bin/python3 \
            "$image" /scan_file_caps.py \
            > "$evidence/file-capability-xattrs.txt" \
            2> "$evidence/file-capability-xattrs.context.txt"

          docker run "${sandbox[@]}" --user dependabot --entrypoint /bin/bash \
            "$image" -c '
              set -euo pipefail
              canary=/home/dependabot/bin/f005-owned-write-canary
              test ! -e "$canary"
              : > "$canary"
              test -f "$canary"
              printf "owned_canary_created=true path=%s\n" "$canary"
              rm -f "$canary"
              test ! -e "$canary"
              printf "owned_canary_removed=true path=%s\n" "$canary"
            ' > "$evidence/dependabot-path-writable-overlay.txt"

          suid_count=$(grep -c '^mode=' "$evidence/suid-sgid.txt" || true)
          filecap_count=$(grep -c '^path=' "$evidence/file-capability-xattrs.txt" || true)
          readonly_writable_path_count=$(grep -c '^dependabot_writable=true' "$evidence/dependabot-path-readonly.txt" || true)
          writable_overlay_canary_count=$(grep -c '^owned_canary_created=true' "$evidence/dependabot-path-writable-overlay.txt" || true)
          printf 'suid_sgid_count=%s\nfilecap_xattr_count=%s\nreadonly_writable_path_count=%s\nwritable_overlay_canary_count=%s\n' \
            "$suid_count" "$filecap_count" "$readonly_writable_path_count" "$writable_overlay_canary_count" \
            | tee "$evidence/status.txt"

      - name: Upload exact helper inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f005-updater-helper-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/f005-updater-helper-inventory
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
